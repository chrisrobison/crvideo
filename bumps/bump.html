<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bump Previewer</title>
<!--
  Standalone <cr-bump> previewer. Pick a bump, hit play.
    bumps/bump.html?bump=<id>[&channel=<channel id>]
  Bumps come from bumps/list.php (public, read-only); the "Up next" rows are
  sample programming relative to now, or a real channel's live lineup. Nothing
  here is saved -- to edit a bump use the Bump Studio (scheduler/ -> BUMPS).
-->
<style>
  :root {
    --bg: #080b12; --panel: #0f1520; --border: #243049; --text: #eef2f8;
    --muted: #8e9ab0; --accent: #ffcc33; --radius: 10px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px clamp(14px, 3vw, 34px); border-bottom: 1px solid var(--border); background: rgba(8, 11, 18, .94); }
  h1 { margin: 0 10px 0 0; font-size: 15px; font-weight: 900; letter-spacing: .05em; }
  h1 b { color: var(--accent); }
  label { font-size: 12px; color: var(--muted); }
  select, button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; }
  select { min-width: 0; max-width: 100%; }
  button { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button:hover { border-color: #3a4a6b; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a1400; font-weight: 700; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .field { display: flex; align-items: center; gap: 6px; }
  #bump { width: min(320px, 60vw); }
  .spacer { flex: 1; }
  main { max-width: 1100px; margin: 0 auto; padding: clamp(14px, 3vw, 28px) clamp(14px, 3vw, 34px) 48px; }

  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: var(--radius);
    overflow: hidden; box-shadow: 0 0 0 1px var(--border); }
  .stage:fullscreen { border-radius: 0; }
  cr-bump { position: absolute; inset: 0; width: 100%; height: 100%; }
  .overlay { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .35); border: 0; border-radius: 0; font-size: 18px; }
  .overlay span { display: flex; align-items: center; justify-content: center; width: 76px; height: 76px; border-radius: 50%;
    background: var(--accent); color: #1a1400; font-size: 30px; padding-left: 5px; }
  .overlay[hidden] { display: none; }
  .hud { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; align-items: center; gap: 12px;
    padding: 22px 14px 10px; background: linear-gradient(transparent, rgba(0, 0, 0, .75)); transition: opacity .2s; }
  .stage.playing:not(:hover):not(:focus-within) .hud { opacity: 0; }
  .hud button { border: 0; background: transparent; padding: 2px 4px; font-size: 18px; line-height: 1; }
  .time { font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap; }
  .scrub { position: relative; flex: 1; height: 16px; cursor: pointer; touch-action: none; }
  .scrub::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .3); }
  .scrub .fill { position: absolute; left: 0; top: 7px; height: 3px; border-radius: 2px; background: #fff; width: 0; }
  .scrub .dot { position: absolute; top: 3px; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: #fff; left: 0; }

  .meta { margin-top: 18px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px 32px; }
  .meta h2 { margin: 0 0 2px; font-size: 20px; }
  .meta p { margin: 0; color: var(--muted); }
  dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 13px; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .swatch { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; box-shadow: 0 0 0 1px #fff3; }
  #status { margin-top: 14px; color: var(--muted); font-size: 13px; min-height: 1.4em; }
  #status.err { color: #ffb4b4; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 18px; }
  kbd { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; font-size: 11px; }
  @media (max-width: 700px) { .meta { grid-template-columns: 1fr; } .spacer { display: none; } }
</style>
</head>
<body>
<header>
  <h1>CR<b>BUMP</b> PREVIEW</h1>
  <button id="prev" aria-label="Previous bump" title="Previous bump (←)">‹</button>
  <div class="field"><label for="bump">Bump</label><select id="bump"></select></div>
  <button id="next" aria-label="Next bump" title="Next bump (→)">›</button>
  <span class="spacer"></span>
  <div class="field"><label for="source">Up next from</label><select id="source"><option value="">Sample programming</option></select></div>
  <button id="loop" aria-pressed="false" title="Loop the bump">⟳ Loop</button>
</header>

<main>
  <div class="stage" id="stage">
    <cr-bump id="player"></cr-bump>
    <button class="overlay" id="overlay" aria-label="Play"><span>▶</span></button>
    <div class="hud">
      <button id="play" aria-label="Play">▶</button>
      <span class="time"><span id="cur">0:00</span> / <span id="dur">0:15</span></span>
      <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="Position"><div class="fill"></div><div class="dot"></div></div>
      <button id="mute" aria-label="Mute" aria-pressed="false">🔊</button>
      <button id="fs" aria-label="Fullscreen" title="Fullscreen (f)">⛶</button>
    </div>
  </div>

  <div id="status" aria-live="polite"></div>

  <section class="meta">
    <div><h2 id="name"></h2><p id="desc"></p></div>
    <dl id="details"></dl>
  </section>
  <p class="hint"><kbd>Space</kbd> play/pause · <kbd>←</kbd>/<kbd>→</kbd> previous/next bump · <kbd>f</kbd> fullscreen · <kbd>m</kbd> mute</p>
</main>

<script type="module">
import "../channels/bump-player.js";

const $ = (id) => document.getElementById(id);
const player = $("player");
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const params = new URLSearchParams(location.search);

const SAMPLE = [
  { title: "Midnight Movies", inMinutes: 5 },
  { title: "Signal Sunrise", inMinutes: 35 },
  { title: "Revolution Rising", inMinutes: 65 },
  { title: "Mid-Day Music Videos", inMinutes: 95 },
  { title: "Musical Crafternoon", inMinutes: 125 },
  { title: "Prime Time Live", inMinutes: 155 },
];

let bumps = [];
let current = null;
let muted = false;
let userStarted = false;   // browsers only allow sound after a gesture
let broadcast = null;      // channels/broadcast.js, loaded on demand
let channelData = null;    // {upcoming, channel} for the selected channel, or null for sample rows

function status(msg, err = false) { const el = $("status"); el.textContent = msg; el.className = err ? "err" : ""; }

// ---------- bumps ----------

async function loadBumps() {
  const res = await fetch("list.php", { cache: "no-cache" });
  if (!res.ok) throw new Error(`list.php returned ${res.status}`);
  return (await res.json()).bumps || [];
}

function renderDetails(b) {
  $("name").textContent = b.name;
  $("desc").textContent = b.description || "";
  const bg = b.background || {};
  const rows = [];
  const add = (k, v) => rows.push([k, v]);
  add("ID", b.id);
  add("Background", bg.type === "color" ? `<span class="swatch" style="background:${esc(bg.color)}"></span>${esc(bg.color)}` : `${esc(bg.type)} · ${esc(bg.url || "")}`);
  add("Audio", (b.audio || []).length ? b.audio.map((a) => `${esc(a.source)} · ${esc(a.url)} (${Math.round((a.volume ?? 0) * 100)}%)`).join("<br>") : "none");
  add("Announcement", b.announcement ? `${esc(b.announcement.url)}${b.announcement.start ? ` @ ${b.announcement.start}s` : ""}` : "none");
  add("Up next", `${b.upcoming?.count ?? 0} shows · “${esc(b.upcoming?.label || "")}”`);
  add("Duration", b.duration ? `${b.duration}s` : "not set (previews at 15s)");
  $("details").innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function upcomingRows() {
  if (channelData) return channelData.upcoming;
  const now = Math.floor(Date.now() / 1000);
  return SAMPLE.map((r) => ({ title: r.title, startsAt: now + r.inMinutes * 60 }));
}

function select(id, { play = false, push = true } = {}) {
  const b = bumps.find((x) => x.id === id) || bumps[0];
  if (!b) return;
  current = b;
  $("bump").value = b.id;
  document.title = `${b.name} · Bump Previewer`;
  if (push) { params.set("bump", b.id); history.replaceState(null, "", `?${params}`); }
  player.stop();
  player.definition = b;
  player.upcoming = upcomingRows();
  player.channel = channelData?.channel ?? null;
  renderDetails(b);
  $("dur").textContent = fmt(player.duration);
  showTime(0);
  if (play || userStarted) start();
}

function step(dir) {
  const i = bumps.findIndex((b) => b.id === current?.id);
  select(bumps[(i + dir + bumps.length) % bumps.length].id, { play: userStarted });
}

// ---------- transport ----------

function start() { userStarted = true; player.play({ muted }); }
function toggle() { player.playing ? player.pause() : start(); }

function showTime(t) {
  const d = player.duration || 1;
  $("cur").textContent = fmt(t);
  $("dur").textContent = fmt(d);
  const pct = Math.min(100, (t / d) * 100);
  $("scrub").querySelector(".fill").style.width = `${pct}%`;
  $("scrub").querySelector(".dot").style.left = `${pct}%`;
  $("scrub").setAttribute("aria-valuenow", String(Math.round(t)));
  $("scrub").setAttribute("aria-valuemax", String(Math.round(d)));
}

player.addEventListener("bump-time", (e) => showTime(e.detail.time));
player.addEventListener("bump-media", () => showTime(player.currentTime));
player.addEventListener("bump-state", (e) => {
  const playing = e.detail.playing;
  $("stage").classList.toggle("playing", playing);
  $("play").textContent = playing ? "⏸" : "▶";
  $("play").setAttribute("aria-label", playing ? "Pause" : "Play");
  $("overlay").hidden = playing || userStarted;
});
player.addEventListener("bump-ended", () => { $("stage").classList.remove("playing"); $("play").textContent = "▶"; });

$("overlay").addEventListener("click", start);
$("play").addEventListener("click", toggle);
$("mute").addEventListener("click", () => {
  muted = !muted;
  player.setMuted(muted);
  $("mute").textContent = muted ? "🔇" : "🔊";
  $("mute").setAttribute("aria-pressed", String(muted));
});
$("loop").addEventListener("click", () => {
  const on = $("loop").getAttribute("aria-pressed") !== "true";
  $("loop").setAttribute("aria-pressed", String(on));
  player.endBehavior = on ? "loop" : "stop";
});
$("fs").addEventListener("click", () => document.fullscreenElement ? document.exitFullscreen() : $("stage").requestFullscreen?.());

const scrub = $("scrub");
function scrubTo(e) {
  const r = scrub.getBoundingClientRect();
  player.seek(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * player.duration);
}
scrub.addEventListener("pointerdown", (e) => { scrub.setPointerCapture(e.pointerId); scrubTo(e); });
scrub.addEventListener("pointermove", (e) => { if (scrub.hasPointerCapture(e.pointerId)) scrubTo(e); });
scrub.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") { player.seek(player.currentTime - 2); e.preventDefault(); e.stopPropagation(); }
  if (e.key === "ArrowRight") { player.seek(player.currentTime + 2); e.preventDefault(); e.stopPropagation(); }
});

// ---------- selection ----------

$("bump").addEventListener("change", (e) => select(e.target.value, { play: userStarted }));
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));

document.addEventListener("keydown", (e) => {
  if (e.target.matches?.("select, input") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === " ") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "f") $("fs").click();
  else if (e.key === "m") $("mute").click();
});

async function selectSource(channelId) {
  channelData = null;
  if (channelId) {
    status("Loading channel lineup…");
    try {
      broadcast ??= await import("../channels/broadcast.js");
      const channel = await broadcast.loadChannel(channelId);
      const t = broadcast.now();
      const upcoming = broadcast.airings(channel.timeline, t, t + 12 * 3600)
        .filter((a) => a.playable && a.startsAt > t).slice(0, 6)
        .map((a) => ({ title: a.title, startsAt: a.startsAt }));
      channelData = { upcoming, channel: { name: channel.name, logo: channel.logo } };
      status(upcoming.length ? "" : `${channel.name} has nothing scheduled in the next 12 hours.`);
    } catch (err) {
      status(`Couldn't load channel “${channelId}”: ${err.message}`, true);
      $("source").value = "";
    }
  } else status("");
  params.set("channel", channelId || ""); if (!channelId) params.delete("channel");
  history.replaceState(null, "", `?${params}`);
  player.upcoming = upcomingRows();
  player.channel = channelData?.channel ?? null;
}
$("source").addEventListener("change", (e) => selectSource(e.target.value));

// ---------- boot ----------

player.endBehavior = "stop";
try {
  bumps = await loadBumps();
  if (!bumps.length) throw new Error("No bumps found in bumps/.");
  $("bump").innerHTML = bumps.map((b) => `<option value="${esc(b.id)}">${esc(b.name)}</option>`).join("");
  select(params.get("bump"), { push: false });
} catch (err) {
  status(`Couldn't load bumps: ${err.message}`, true);
}

// Channel choices are optional; the previewer works fine without them.
try {
  broadcast ??= await import("../channels/broadcast.js");
  const channels = await broadcast.listChannels();
  $("source").insertAdjacentHTML("beforeend", channels.map((c) => `<option value="${esc(c.id)}">${esc(c.name || c.id)}</option>`).join(""));
  const want = params.get("channel");
  if (want && channels.some((c) => c.id === want)) { $("source").value = want; await selectSource(want); }
} catch { /* sample programming only */ }
</script>
</body>
</html>
