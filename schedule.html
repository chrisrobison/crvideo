<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stream Schedule Programmer</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#1a1e25;--panel2:#21262f;--border:#343b47;--text:#f4f6f8;--muted:#9aa4b2;--accent:#7c8cff;--warn:#f5c451;--good:#62d394}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);background:#15181e}h1{margin:0;font-size:20px}h2{margin:0 0 14px;font-size:16px}
button,input,select,textarea{font:inherit}button{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:7px;padding:8px 11px;cursor:pointer}button:hover{border-color:#596477}button.primary{background:var(--accent);border-color:var(--accent);font-weight:700}.toolbar{display:flex;flex-wrap:wrap;gap:8px}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;min-width:0}.schedule{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:top}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}td.time{white-space:nowrap}td.url{max-width:310px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#b9c0ff}tr.problem{background:rgba(245,196,81,.07)}.badge{display:inline-block;padding:2px 7px;border-radius:999px;background:#2a3040;color:#cfd6ff;font-size:12px}.row-actions{display:flex;gap:5px;flex-wrap:wrap}.row-actions button{padding:5px 7px}label{display:block;margin:0 0 10px;color:var(--muted);font-size:12px}input,select,textarea{width:100%;margin-top:5px;border:1px solid var(--border);background:#11151b;color:var(--text);border-radius:7px;padding:9px 10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.summary{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 12px;color:var(--muted)}.summary strong{color:var(--text)}.message{margin-top:10px;min-height:20px;color:var(--muted)}.message.error{color:#ff9999}.message.ok{color:var(--good)}textarea#jsonPreview{min-height:260px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}.small{color:var(--muted);font-size:12px}input[type=file]{display:none}.hidden{display:none!important}@media(max-width:900px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><h1>24/7 Stream Schedule</h1><div class="small">Clock-driven programming editor</div></div><div class="toolbar"><button id="loadServerBtn">Load playlist.json</button><button id="importBtn">Import JSON</button><input id="fileInput" type="file" accept=".json,application/json"><button id="copyBtn">Copy JSON</button><button id="downloadBtn" class="primary">Download playlist.json</button></div></header>
<main>
<section class="panel"><div class="summary"><span><strong id="entryCount">0</strong> segments</span><span><strong id="totalDuration">0:00:00</strong> programmed</span><span id="healthSummary"><strong>—</strong></span></div><div class="schedule"><table><thead><tr><th>#</th><th>Title</th><th>Start</th><th>End</th><th>Duration</th><th>Source</th><th>URL</th><th>Actions</th></tr></thead><tbody id="scheduleBody"></tbody></table></div><div class="message" id="message"></div></section>
<aside>
<section class="panel"><h2 id="formTitle">Add segment</h2><label>Title<input id="titleInput" placeholder="Archive show, venue reel, etc."></label><label>Video URL<input id="urlInput" placeholder="https://..."></label><div class="grid2"><label>Provider<select id="providerInput"><option value="">Auto</option><option value="html5">HTML5 / MP4</option><option value="vimeo">Vimeo</option></select></label><label>Duration<input id="durationInput" value="01:00:00" placeholder="HH:MM:SS"></label></div><label>Start<input id="startInput" type="datetime-local" step="1"></label><div class="form-actions"><button id="useNextBtn">Start after last</button><button id="saveSegmentBtn" class="primary">Add segment</button><button id="cancelEditBtn" class="hidden">Cancel</button></div><div class="message" id="formMessage"></div></section>
<section class="panel" style="margin-top:16px"><h2>Generated JSON</h2><textarea id="jsonPreview" spellcheck="false"></textarea><div class="form-actions"><button id="applyJsonBtn">Apply edited JSON</button></div></section>
</aside></main>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id), body=$("scheduleBody"), jsonPreview=$("jsonPreview"), message=$("message"), formMessage=$("formMessage"), titleInput=$("titleInput"), urlInput=$("urlInput"), providerInput=$("providerInput"), durationInput=$("durationInput"), startInput=$("startInput"), formTitle=$("formTitle"), saveSegmentBtn=$("saveSegmentBtn"), cancelEditBtn=$("cancelEditBtn"), fileInput=$("fileInput");
let data={version:1,entries:[]}, editingId=null;
const sample={"version":1,"entries":[{"id":"segment-1","title":"2:20 PM - 3:20 PM","start":"2026-08-28T14:20:00-07:00","end":"2026-08-28T15:20:00-07:00","url":"https://cdr2.com/crvideo/video-001.mp4"},{"id":"segment-2","title":"27 seconds","start":"2026-08-28T15:20:01-07:00","end":"2026-08-28T15:20:28-07:00","url":"https://vimeo.com/44859943","provider":"vimeo"},{"id":"segment-3","title":"rerun","start":"2026-08-28T15:20:29-07:00","end":"2026-08-28T16:20:29-07:00","url":"https://cdr2.com/crvideo/video-001.mp4"},{"id":"segment-4","title":"short","start":"2026-08-28T16:20:30-07:00","end":"2026-08-28T16:35:30-07:00","url":"https://cdr2.com/crvideo/video-002.mp4"}]};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function parseDuration(s){const p=String(s).trim().split(":").map(Number);if(p.some(n=>!Number.isFinite(n)||n<0))return null;if(p.length===3)return p[0]*3600+p[1]*60+p[2];if(p.length===2)return p[0]*60+p[1];if(p.length===1)return p[0];return null}
function fmtDuration(seconds){seconds=Math.max(0,Math.round(seconds));const h=Math.floor(seconds/3600),m=Math.floor((seconds%3600)/60),s=seconds%60;return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function offsetString(d){const mins=-d.getTimezoneOffset(),sign=mins>=0?"+":"-",abs=Math.abs(mins);return `${sign}${String(Math.floor(abs/60)).padStart(2,"0")}:${String(abs%60).padStart(2,"0")}`}
function isoLocal(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0"),hh=String(d.getHours()).padStart(2,"0"),mm=String(d.getMinutes()).padStart(2,"0"),ss=String(d.getSeconds()).padStart(2,"0");return `${y}-${m}-${day}T${hh}:${mm}:${ss}${offsetString(d)}`}
function toDatetimeLocal(iso){const d=new Date(iso);if(!Number.isFinite(d.getTime()))return"";return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}T${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`}
function formatDisplay(iso){const d=new Date(iso);return Number.isFinite(d.getTime())?new Intl.DateTimeFormat(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit",second:"2-digit"}).format(d):"Invalid"}
const providerFor=e=>e.provider||(/vimeo\.com/i.test(e.url||"")?"vimeo":"html5");
function nextId(){let n=1,ids=new Set(data.entries.map(e=>e.id));while(ids.has(`segment-${n}`))n++;return`segment-${n}`}
const sortEntries=()=>data.entries.sort((a,b)=>new Date(a.start)-new Date(b.start));
function scheduleIssues(){sortEntries();const issues=new Map();let gaps=0,overlaps=0;for(let i=0;i<data.entries.length;i++){const e=data.entries[i],s=new Date(e.start).getTime(),en=new Date(e.end).getTime();if(!Number.isFinite(s)||!Number.isFinite(en)||en<=s){issues.set(e.id,"Invalid time range");continue}if(i>0){const prevEnd=new Date(data.entries[i-1].end).getTime(),delta=s-prevEnd;if(delta<0){issues.set(e.id,`Overlaps previous by ${fmtDuration(Math.abs(delta)/1000)}`);overlaps++}else if(delta>0){issues.set(e.id,`Gap of ${fmtDuration(delta/1000)}`);gaps++}}}return{issues,gaps,overlaps}}
function render(){sortEntries();const health=scheduleIssues();body.innerHTML=data.entries.map((e,i)=>{const s=new Date(e.start),en=new Date(e.end),dur=(en-s)/1000,issue=health.issues.get(e.id);return `<tr class="${issue?"problem":""}"><td>${i+1}</td><td><strong>${esc(e.title||e.id)}</strong>${issue?`<div class="small" style="color:var(--warn)">${esc(issue)}</div>`:""}</td><td class="time">${esc(formatDisplay(e.start))}</td><td class="time">${esc(formatDisplay(e.end))}</td><td class="time">${fmtDuration(dur)}</td><td><span class="badge">${esc(providerFor(e))}</span></td><td class="url" title="${esc(e.url)}">${esc(e.url)}</td><td><div class="row-actions"><button data-act="edit" data-id="${esc(e.id)}">Edit</button><button data-act="duplicate" data-id="${esc(e.id)}">Duplicate</button><button data-act="up" data-id="${esc(e.id)}">↑</button><button data-act="down" data-id="${esc(e.id)}">↓</button><button data-act="delete" data-id="${esc(e.id)}">Delete</button></div></td></tr>`}).join("");$("entryCount").textContent=data.entries.length;const total=data.entries.reduce((sum,e)=>{const s=new Date(e.start),en=new Date(e.end);return sum+(Number.isFinite(s.getTime())&&Number.isFinite(en.getTime())?Math.max(0,(en-s)/1000):0)},0);$("totalDuration").textContent=fmtDuration(total);$("healthSummary").innerHTML=!health.gaps&&!health.overlaps?`<strong style="color:var(--good)">No gaps / overlaps</strong>`:`<strong style="color:var(--warn)">${health.gaps} gap(s), ${health.overlaps} overlap(s)</strong>`;jsonPreview.value=JSON.stringify(data,null,2)}
function setStartAfterLast(){let d;if(data.entries.length){sortEntries();d=new Date(data.entries[data.entries.length-1].end)}else{d=new Date();d.setSeconds(0,0)}startInput.value=toDatetimeLocal(d.toISOString())}
function resetForm(){editingId=null;formTitle.textContent="Add segment";saveSegmentBtn.textContent="Add segment";cancelEditBtn.classList.add("hidden");titleInput.value="";urlInput.value="";providerInput.value="";durationInput.value="01:00:00";setStartAfterLast();formMessage.textContent=""}
function saveSegment(){formMessage.className="message";const dur=parseDuration(durationInput.value),start=new Date(startInput.value);if(!titleInput.value.trim())return fail("Enter a title.");if(!urlInput.value.trim())return fail("Enter a video URL.");if(!Number.isFinite(start.getTime()))return fail("Enter a valid start time.");if(!Number.isFinite(dur)||dur<=0)return fail("Duration must be HH:MM:SS and greater than zero.");const end=new Date(start.getTime()+dur*1000),entry={id:editingId||nextId(),title:titleInput.value.trim(),start:isoLocal(start),end:isoLocal(end),url:urlInput.value.trim()};if(providerInput.value)entry.provider=providerInput.value;if(editingId){const i=data.entries.findIndex(e=>e.id===editingId);if(i>=0)data.entries[i]=entry}else data.entries.push(entry);render();resetForm();function fail(t){formMessage.textContent=t;formMessage.classList.add("error")}}
function editEntry(id){const e=data.entries.find(x=>x.id===id);if(!e)return;editingId=id;formTitle.textContent=`Edit ${id}`;saveSegmentBtn.textContent="Save changes";cancelEditBtn.classList.remove("hidden");titleInput.value=e.title||"";urlInput.value=e.url||"";providerInput.value=e.provider||"";durationInput.value=fmtDuration((new Date(e.end)-new Date(e.start))/1000);startInput.value=toDatetimeLocal(e.start)}
function duplicateEntry(id){const e=data.entries.find(x=>x.id===id);if(!e)return;const oldStart=new Date(e.start),oldEnd=new Date(e.end),dur=oldEnd-oldStart,newStart=new Date(oldEnd.getTime()),newEnd=new Date(newStart.getTime()+dur);data.entries.push({...e,id:nextId(),title:`${e.title} copy`,start:isoLocal(newStart),end:isoLocal(newEnd)});render()}
function moveEntry(id,dir){sortEntries();const idx=data.entries.findIndex(e=>e.id===id),target=idx+dir;if(idx<0||target<0||target>=data.entries.length)return;const a=data.entries[idx],b=data.entries[target],aDur=new Date(a.end)-new Date(a.start),bDur=new Date(b.end)-new Date(b.start);if(dir<0){const slot=new Date(b.start);a.start=isoLocal(slot);a.end=isoLocal(new Date(slot.getTime()+aDur));b.start=isoLocal(new Date(a.end));b.end=isoLocal(new Date(new Date(b.start).getTime()+bDur))}else{const slot=new Date(a.start);b.start=isoLocal(slot);b.end=isoLocal(new Date(slot.getTime()+bDur));a.start=isoLocal(new Date(b.end));a.end=isoLocal(new Date(new Date(a.start).getTime()+aDur))}render()}
body.addEventListener("click",ev=>{const btn=ev.target.closest("button[data-act]");if(!btn)return;const id=btn.dataset.id,act=btn.dataset.act;if(act==="edit")editEntry(id);if(act==="duplicate")duplicateEntry(id);if(act==="delete"){data.entries=data.entries.filter(e=>e.id!==id);render();if(editingId===id)resetForm()}if(act==="up")moveEntry(id,-1);if(act==="down")moveEntry(id,1)});
$("useNextBtn").addEventListener("click",setStartAfterLast);saveSegmentBtn.addEventListener("click",saveSegment);cancelEditBtn.addEventListener("click",resetForm);$("importBtn").addEventListener("click",()=>fileInput.click());
fileInput.addEventListener("change",async()=>{const file=fileInput.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed.entries))throw new Error("JSON must contain an entries array.");data=parsed;render();resetForm();message.textContent=`Loaded ${file.name}`;message.className="message ok"}catch(e){message.textContent=e.message;message.className="message error"}fileInput.value=""});
$("loadServerBtn").addEventListener("click",async()=>{try{const r=await fetch(`playlist.json?_=${Date.now()}`,{cache:"no-store"});if(!r.ok)throw new Error(`HTTP ${r.status}`);const parsed=await r.json();if(!Array.isArray(parsed.entries))throw new Error("playlist.json has no entries array.");data=parsed;render();resetForm();message.textContent="Loaded playlist.json";message.className="message ok"}catch(e){message.textContent=`Could not load playlist.json: ${e.message}`;message.className="message error"}});
$("copyBtn").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(JSON.stringify(data,null,2));message.textContent="JSON copied.";message.className="message ok"}catch(_){jsonPreview.focus();jsonPreview.select();message.textContent="Clipboard unavailable; JSON selected instead.";message.className="message"}});
$("downloadBtn").addEventListener("click",()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="playlist.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
$("applyJsonBtn").addEventListener("click",()=>{try{const parsed=JSON.parse(jsonPreview.value);if(!Array.isArray(parsed.entries))throw new Error("JSON must contain an entries array.");data=parsed;render();resetForm();message.textContent="Applied edited JSON.";message.className="message ok"}catch(e){message.textContent=e.message;message.className="message error"}});
data=structuredClone(sample);render();resetForm();})();
</script>
</body>
</html>
