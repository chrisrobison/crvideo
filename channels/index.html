<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Channel Guide</title>
<style>
:root{
  color-scheme:dark;
  --bg:#080b12; --panel:#0f1420; --lane:#121a29; --cell:#1a2338; --cell-hover:#26345a;
  --cell-now:#1d3a6b; --border:#243049; --text:#eef2f8; --muted:#8e9ab0; --accent:#ffcc33; --live:#ff4b4b;
  --chan-w:220px; --lane-w:7200px;
}
*{box-sizing:border-box}
html,body{height:100%}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column}
body.player-expanded{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)}
.brand{font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:14px;color:var(--muted)}
.brand b{color:var(--accent)}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}

.preview{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:24px;padding:20px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#0d1322,var(--bg))}
.screen{position:relative;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;cursor:pointer;box-shadow:0 0 0 1px var(--border)}
.screen .badge{position:absolute;top:10px;left:10px;background:var(--live);color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;padding:3px 7px;border-radius:4px;pointer-events:none;z-index:1}
.screen .hover-hint{position:absolute;inset:auto 0 0 0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.8));font-weight:700;opacity:0;transition:opacity .15s;pointer-events:none;z-index:1}
.screen:hover .hover-hint,.screen:focus-visible .hover-hint{opacity:1}
[hidden]{display:none!important}

.info{min-width:0;display:flex;flex-direction:column;gap:8px}
.ch-line{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:700}
.ch-line .num{color:var(--accent);font-size:22px;font-variant-numeric:tabular-nums}
.ch-line img{height:28px}
.info h1{margin:0;font-size:clamp(22px,3vw,32px);line-height:1.15}
.sub{color:var(--muted)}
.progress{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.bar{flex:1;max-width:320px;height:5px;border-radius:3px;background:var(--cell)}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent);width:0}
.desc{margin:0;color:#c3cbd9;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:70ch}
.next{color:var(--muted)}
.next b{color:var(--text)}
.watch{align-self:flex-start;margin-top:6px;background:var(--accent);color:#14100a;font-weight:800;padding:10px 16px;border-radius:6px}
.watch:hover{filter:brightness(1.08)}

/* The expanded "theater" overlay -- the SAME <cr-channel-player> element
   gets reparented in here (see expandChannel()/collapsePlayer()) rather
   than a second instance ever being created, so nothing it's already
   playing ever restarts. view-transition-name on the player itself is
   what lets the browser morph its box from the small tile above to this
   full-viewport one instead of just cutting/cross-fading between them. */
#watchOverlay{position:fixed;inset:0;background:#000;z-index:50}
#watchOverlay[hidden]{display:none}
cr-channel-player{view-transition-name:cr-player}
@media (prefers-reduced-motion:reduce){
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
}

/* The grid is its own scroll container (both axes) so the sticky ruler
   (top) and sticky channel column (left) can stick relative to it, and so
   the time axis -- wider than any viewport, see --lane-w -- scrolls
   horizontally without taking the whole page with it. */
.grid{flex:1 1 auto;min-height:0;overflow:auto;position:relative;padding:0 0 40px}
.ruler{display:grid;grid-template-columns:var(--chan-w) var(--lane-w);width:max-content;position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--border);height:38px}
.ruler .day{position:sticky;left:0;z-index:4;padding:10px 20px;color:var(--muted);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;background:var(--bg)}
.ticks{position:relative}
.ticks span{position:absolute;top:10px;padding-left:8px;border-left:1px solid var(--border);height:28px;font-weight:700;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row{border-bottom:1px solid var(--border)}
.row-main{display:grid;grid-template-columns:var(--chan-w) var(--lane-w);width:max-content;height:64px}
.chan{position:sticky;left:0;z-index:2;display:flex;align-items:center;gap:10px;padding:0 14px 0 20px;background:var(--panel);min-width:0}
.chan .num{color:var(--accent);font-weight:800;font-size:18px;min-width:1.6em;font-variant-numeric:tabular-nums}
.chan img{height:30px;max-width:56px;object-fit:contain}
.chan .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.focused .chan{background:#18213a;box-shadow:inset 3px 0 var(--accent)}
.lane{position:relative;background:var(--lane);overflow:hidden}
.prog{position:absolute;top:4px;bottom:4px;padding:7px 10px;background:var(--cell);border-radius:4px;overflow:hidden;white-space:nowrap;min-width:0}
.prog:hover{background:var(--cell-hover)}
.prog.now{background:var(--cell-now)}
.prog.now:hover{background:#28508f}
.prog.cut{border-top-left-radius:0;border-bottom-left-radius:0}
.prog.cut .t::before{content:"‹ ";color:var(--muted)}
.prog .t{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.prog .s{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.gap{position:absolute;top:4px;bottom:4px;background:repeating-linear-gradient(135deg,transparent 0 4px,rgba(255,255,255,.04) 4px 8px)}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--live);z-index:1;pointer-events:none}
.empty{padding:40px 20px;color:var(--muted)}

/* A future timeslot's "detailed accounting" -- sticks just right of the
   (always-visible) channel label regardless of scroll position, rather
   than living wherever its timeslot happens to have scrolled to. Never
   tunes the channel; it's purely informational (see the click handling
   in the script -- only the "now" cell or the channel button itself
   opens the channel). */
.row-detail{display:none;position:sticky;left:var(--chan-w);z-index:2;width:min(560px,calc(100vw - var(--chan-w) - 24px));margin:10px 14px 16px;padding:14px 40px 14px 14px;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.4)}
.row.expanded .row-detail{display:block}
.row-detail .thumb{display:block;width:160px;max-width:40%;border-radius:6px;float:left;margin:0 12px 8px 0}
.row-detail h3{margin:0 0 6px;font-size:16px;line-height:1.3}
.row-detail .meta{color:var(--muted);font-size:13px;margin-bottom:8px;font-variant-numeric:tabular-nums}
.row-detail p{margin:0;color:#c3cbd9;font-size:14px;line-height:1.5}
.row-detail .close{position:absolute;top:8px;right:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px;border-radius:5px}
.row-detail .close:hover{background:var(--cell);color:var(--text)}
.row-detail .airing-now{clear:both;margin:10px 0 0;color:var(--accent);font-size:13px;font-weight:700}
.row-detail .episodes{clear:both;list-style:none;margin:10px 0 0;padding:0;max-height:220px;overflow-y:auto;border-top:1px solid var(--border)}
.row-detail .episodes li{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.row-detail .episodes li.current{background:rgba(255,204,51,.08);margin:0 -8px;padding:7px 8px;border-radius:4px}
.row-detail .ep-time{flex:0 0 auto;color:var(--accent);font-variant-numeric:tabular-nums;font-weight:700;min-width:4.5em}
.row-detail .ep-title{flex:1 1 auto;min-width:0;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-detail .ep-sub{flex:0 0 auto;color:var(--muted);font-size:12px;white-space:nowrap}

@media (max-width:900px){
  .preview{grid-template-columns:1fr;gap:14px;padding:16px}
  :root{--chan-w:150px}
}
@media (max-width:600px){
  :root{--chan-w:84px}
  .top{padding:12px 16px}
  .chan{padding:0 8px 0 16px}
  .chan .name{display:none}
  .chan img{max-width:44px}
  .ruler .day{padding:10px 16px}
  .row-detail{width:min(420px,calc(100vw - var(--chan-w) - 16px))}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>CRVideo</b> Channel Guide</div>
  <div class="clock" id="clock"></div>
</header>

<section class="preview" id="preview" hidden>
  <div class="screen" id="screen" role="button" tabindex="0" aria-label="Watch this channel">
    <span class="badge">LIVE</span>
    <span class="hover-hint">Watch full screen ›</span>
  </div>
  <div class="info">
    <div class="ch-line"><span class="num" id="pNum"></span><img id="pLogo" alt=""><span id="pName"></span></div>
    <h1 id="pTitle"></h1>
    <div class="sub" id="pMeta"></div>
    <div class="progress"><span id="pRange"></span><div class="bar"><i id="pBar"></i></div><span id="pLeft"></span></div>
    <p class="desc" id="pDesc"></p>
    <div class="next" id="pNext"></div>
    <button class="watch" id="pWatch">Watch</button>
  </div>
</section>

<section class="grid" id="grid" aria-label="Program guide">
  <div class="ruler"><div class="day" id="day">Today</div><div class="ticks" id="ticks"></div></div>
  <div id="rows"></div>
</section>

<div id="watchOverlay" hidden></div>

<script type="module">
import {
  listChannels, loadChannel, loadCatalog, locate, airings, nextProgram, now, syncClock,
  clock, minutesLeft, plainText, episodeAiringTimes,
} from "./broadcast.js";
import "./player-view.js";

const SLOT = 1800;
// How much of the schedule the grid shows at once -- scroll sideways to
// browse further into it. 24h covers two full cycles of a 12-hour
// repeating lineup, so a scroll all the way across shows the lineup
// looping back to where it started.
const HORIZON = 24 * 3600;
const PX_PER_SLOT = 220; // width of one 30-minute tick (widened so short/packed programs stay legible)
const PX_PER_SEC = PX_PER_SLOT / SLOT;
const FOCUS_KEY = "crvideo:guide-focus";
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

let channels = [];
let focused = null;
let windowStart = 0;
const span = HORIZON;
let nextBoundary = Infinity;

// The one and only player instance for this page -- also the guide's own
// small "what's on" preview. Compact by default (minimal chrome, sized by
// its .tile parent); expandChannel()/collapsePlayer() below just move this
// SAME element between `tile` and `watchOverlay` and flip `compact`,
// wrapped in a View Transition -- never create a second instance, never
// reload the stream. See channels/player-view.js's header for why this is
// what lets the click that expands it also be the click that unmutes it.
const player = document.createElement("cr-channel-player");
player.compact = true;
player.standalone = false; // this page owns the URL/title, not the player
$("screen").appendChild(player);
player.addEventListener("cr-channel-change", (e) => {
  const match = channels.find((c) => c.id === e.detail.channel.id);
  if (match) setFocus(match, { tune: false }); // already tuned -- just sync the guide's own UI
});
// The title/progress-bar/description panel re-renders whenever the
// player's own airing changes (a program transition, or tune() loading a
// freshly focused channel for the first time) -- same trigger the
// pre-existing small preview player used before this element replaced it.
player.addEventListener("cr-airing", () => renderPreview());

/** An published occurrence's `id` (see channels/publish/src/
 *  ProgrammingCompiler.php) is always the episode's own raw id (e.g.
 *  "yt-xxx"), but a series-sourced catalog.json indexes its episodes as
 *  "<seriesId>:<episodeId>" (see catalog-resolver.js, for collision
 *  resistance across series). A flat, non-series catalog item's id
 *  matches directly. Try the direct key first, then fall back to a
 *  suffix match so series-sourced programs can still show a description/
 *  year/creator/thumbnail instead of silently coming up empty. */
function findCatalogItem(catalog, id) {
  const direct = catalog.get(id);
  if (direct) return direct;
  const suffix = `:${id}`;
  for (const item of catalog.values()) {
    if (typeof item.id === "string" && item.id.endsWith(suffix)) return item;
  }
  return null;
}

/** Start of the current local half hour. */
function halfHourStart(t) {
  const tz = new Date(t * 1000).getTimezoneOffset() * 60;
  return Math.floor((t - tz) / SLOT) * SLOT + tz;
}

const pxLeft = (t) => (t - windowStart) * PX_PER_SEC;

function renderGrid() {
  const t = now();
  const gridEl = $("grid");

  // Re-anchoring the horizon (only happens roughly once per HORIZON, when
  // "now" finally scrolls past the end of what's currently loaded) would
  // otherwise silently reset anyone's horizontal scroll back to the start.
  // Preserve the absolute instant they were looking at instead.
  const anchorAbs = windowStart ? windowStart + gridEl.scrollLeft / PX_PER_SEC : null;
  windowStart = halfHourStart(t);
  const until = windowStart + span;

  const ticks = $("ticks");
  ticks.replaceChildren();
  for (let s = windowStart; s < until; s += SLOT) {
    const tick = el("span", null, clock(s));
    tick.style.left = `${pxLeft(s)}px`;
    ticks.append(tick);
  }

  const hadFocus = document.activeElement?.closest?.(".row")?.dataset.id;
  const rows = $("rows");
  rows.replaceChildren();
  nextBoundary = windowStart + SLOT;

  for (const ch of channels) {
    const row = el("div", "row");
    row.dataset.id = ch.id;
    row.classList.toggle("focused", ch.id === focused?.id);

    const main = el("div", "row-main");

    const chan = el("button", "chan");
    chan.setAttribute("aria-label", `Channel ${ch.number ?? ""} ${ch.name}`.replace(/\s+/g, " "));
    if (ch.number != null) chan.append(el("span", "num", String(ch.number)));
    if (ch.logo) { const img = el("img"); img.src = ch.logo; img.alt = ""; chan.append(img); }
    chan.append(el("span", "name", ch.name));
    chan.addEventListener("click", () => expandChannel(ch.id));
    main.append(chan);

    const detail = el("div", "row-detail");
    const lane = el("div", "lane");
    // Phase 5 of docs/guide-update.md: the guide renders the PROGRAM-level
    // projection (one cell per scheduled program occurrence, e.g. an hour
    // of "Electronics Lab" however many videos got packed into it) --
    // never the raw per-video playback timeline. See buildEpgTimeline()
    // in broadcast.js; ch.timeline (the playback timeline) is untouched
    // and still drives the player above.
    for (const a of airings(ch.epgTimeline, windowStart, until)) {
      const left = Math.max(a.startsAt, windowStart);
      const right = Math.min(a.endsAt, until);
      const isNow = a.startsAt <= t && t < a.endsAt;
      if (isNow) nextBoundary = Math.min(nextBoundary, a.endsAt);
      if (!a.playable) {
        const gap = el("div", "gap");
        gap.style.left = `${pxLeft(left)}px`;
        gap.style.width = `${(right - left) * PX_PER_SEC}px`;
        lane.append(gap);
        continue;
      }
      const cell = el("button", "prog");
      cell.style.left = `${pxLeft(left) + 2}px`;
      cell.style.width = `${(right - left) * PX_PER_SEC - 4}px`;
      cell.classList.toggle("now", isNow);
      cell.classList.toggle("cut", a.startsAt < windowStart);
      const range = `${clock(a.startsAt)} – ${clock(a.endsAt)}`;
      // Secondary text (Phase 5): the originating series/publisher, when
      // known -- optional, and never a substitute for the program title
      // itself, which always stays the prominent line.
      const secondary = a.seriesTitle || null;
      cell.title = secondary ? `${a.title}\n${secondary}\n${range}` : `${a.title}\n${range}`;
      cell.tabIndex = -1;
      cell.append(el("span", "t", a.title), el("span", "s", secondary ? `${range} · ${secondary}` : range));
      // The "now" cell (or the channel button/number) opens the channel.
      // Any other -- future -- timeslot just expands this row with a
      // detailed accounting of that program; it never changes the channel.
      cell.addEventListener("click", () => {
        if (isNow) expandChannel(ch.id);
        else toggleDetail(row, detail, ch, a);
      });
      lane.append(cell);
    }
    lane.append(el("div", "nowline"));
    main.append(lane);
    row.append(main, detail);

    row.addEventListener("mouseenter", () => hoverFocus(ch));
    row.addEventListener("focusin", () => setFocus(ch));
    rows.append(row);
  }

  if (hadFocus) rows.querySelector(`.row[data-id="${CSS.escape(hadFocus)}"] .chan`)?.focus();
  gridEl.scrollLeft = anchorAbs != null ? Math.max(0, (anchorAbs - windowStart) * PX_PER_SEC) : 0;
  placeNowLines();
}

function placeNowLines() {
  const left = `${pxLeft(now())}px`;
  for (const line of document.querySelectorAll(".nowline")) line.style.left = left;
}

/** Expands/collapses a row's detail card for a given future (or current)
 *  airing. Clicking the same already-expanded timeslot again collapses
 *  it; clicking a different timeslot in the same row swaps the content.
 *  Never calls expandChannel() -- that's the whole point (Phase 6:
 *  selecting a future program must never unexpectedly change playback).
 *  `a` is either a program-level airing (has `.episodes`, built from
 *  buildEpgTimeline()'s grouping) or a legacy per-item airing with no
 *  programming-block identity at all (Phase 8, e.g. Film Day at School) --
 *  renderProgramDetail()/renderEpisodeDetail() below render whichever one
 *  this actually is. */
async function toggleDetail(row, detailEl, ch, a) {
  const key = String(a.startsAt);
  if (row.dataset.expanded === key) {
    row.classList.remove("expanded");
    delete row.dataset.expanded;
    return;
  }
  row.dataset.expanded = key;
  row.classList.add("expanded");

  const close = el("button", "close", "✕");
  close.setAttribute("aria-label", "Close details");
  close.addEventListener("click", () => {
    row.classList.remove("expanded");
    delete row.dataset.expanded;
  });

  detailEl.replaceChildren(close, el("p", null, "Loading…"));

  const catalog = await loadCatalog(ch).catch(() => new Map());
  if (row.dataset.expanded !== key) return; // moved on before this resolved

  detailEl.replaceChildren(close);
  if (Array.isArray(a.episodes)) renderProgramDetail(detailEl, ch, a, catalog);
  else renderEpisodeDetail(detailEl, a, findCatalogItem(catalog, a.id));
}

/** Phase 8 legacy fallback, unchanged from before program-level grouping
 *  existed: a single video/episode's own detail card. */
function renderEpisodeDetail(detailEl, a, item) {
  if (item?.thumbnail_url) {
    const img = el("img", "thumb");
    img.src = item.thumbnail_url;
    img.alt = "";
    detailEl.append(img);
  }
  detailEl.append(el("h3", null, a.title));
  const metaParts = [`${clock(a.startsAt)} – ${clock(a.endsAt)}`];
  if (item?.year) metaParts.push(String(item.year));
  if (item?.creator) metaParts.push(item.creator);
  detailEl.append(el("div", "meta", metaParts.join(" · ")));
  detailEl.append(el("p", null, item ? plainText(item.description) || "No description available." : "No details available for this episode."));
}

/** Phase 6: the full program-level detail card -- program title/
 *  description, channel + timing + total duration + series/publisher,
 *  which underlying episode is airing right now (if this program IS the
 *  one currently on), and the ordered list of every actual video/filler
 *  scheduled within it. Nothing here is hardcoded -- every label comes
 *  from the published schedule (titles/times) or the channel's catalog
 *  (thumbnails/creator), resolved the same way the legacy per-episode
 *  card above always has. */
function renderProgramDetail(detailEl, ch, a, catalog) {
  const firstCatalogItem = a.episodes[0] ? findCatalogItem(catalog, a.episodes[0].id) : null;
  if (firstCatalogItem?.thumbnail_url) {
    const img = el("img", "thumb");
    img.src = firstCatalogItem.thumbnail_url;
    img.alt = "";
    detailEl.append(img);
  }
  detailEl.append(el("h3", null, a.title));

  const totalMinutes = Math.max(1, Math.round((a.endsAt - a.startsAt) / 60));
  const metaParts = [
    `${clock(a.startsAt)} – ${clock(a.endsAt)}`,
    ch.number != null ? `Ch ${ch.number} ${ch.name}` : ch.name,
    `${totalMinutes} min`,
  ];
  if (a.seriesTitle) metaParts.push(a.seriesTitle);
  detailEl.append(el("div", "meta", metaParts.join(" · ")));
  if (a.description) detailEl.append(el("p", null, a.description));

  const t = now();
  const airingNowEpisode = (a.startsAt <= t && t < a.endsAt)
    ? a.episodes.find((ep) => {
      const times = episodeAiringTimes(a, ep);
      return times.startsAt <= t && t < times.endsAt;
    })
    : null;
  if (airingNowEpisode) {
    detailEl.append(el("p", "airing-now", `Currently airing: ${airingNowEpisode.title || "Untitled"}`));
  }

  const list = el("ul", "episodes");
  for (const ep of a.episodes) {
    const { startsAt } = episodeAiringTimes(a, ep);
    const li = el("li");
    if (ep === airingNowEpisode) li.classList.add("current");
    const catalogItem = ep.id ? findCatalogItem(catalog, ep.id) : null;
    li.append(el("span", "ep-time", clock(startsAt)));
    li.append(el("span", "ep-title", ep.title || (ep.playable ? ep.id : "Station break")));
    const providerBits = [catalogItem?.creator, minutesLeft(Math.max(1, ep.end - ep.start))].filter(Boolean);
    if (providerBits.length) li.append(el("span", "ep-sub", providerBits.join(" · ")));
    list.append(li);
  }
  detailEl.append(list);
}

let hoverTimer = 0;
function hoverFocus(ch) {
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(() => setFocus(ch), 180);
}

/** Moves the guide's "what's on" focus to `ch` -- tunes the shared player
 *  (unless it's already there, e.g. we're just syncing UI after the
 *  player's OWN remote control changed channel -- see the
 *  cr-channel-change listener above) and updates the info panel. */
function setFocus(ch, { tune = true } = {}) {
  clearTimeout(hoverTimer);
  if (focused?.id === ch.id) return;
  focused = ch;
  try { localStorage.setItem(FOCUS_KEY, ch.id); } catch { /* optional */ }
  for (const row of document.querySelectorAll(".row")) row.classList.toggle("focused", row.dataset.id === ch.id);
  $("pNum").textContent = ch.number ?? "";
  $("pName").textContent = ch.name;
  $("pLogo").hidden = !ch.logo;
  if (ch.logo) $("pLogo").src = ch.logo;
  $("pWatch").textContent = ch.number != null ? `Watch channel ${ch.number}` : `Watch ${ch.name}`;
  if (tune) player.tune(ch.id);
}

async function renderPreview() {
  const ch = focused;
  if (!ch) return;
  const a = player.player.airing || locate(ch.timeline);
  const t = now();
  $("pTitle").textContent = a.playable ? a.title : "Station break";
  $("pRange").textContent = `${clock(a.startsAt)} – ${clock(a.endsAt)}`;
  const next = nextProgram(ch.timeline, t);
  $("pNext").replaceChildren();
  if (next) $("pNext").append("Next: ", el("b", null, next.title), ` at ${clock(next.startsAt)}`);
  updateProgress();

  $("pMeta").textContent = "";
  $("pDesc").textContent = a.playable ? "" : ch.description;
  if (!a.playable) return;
  const item = findCatalogItem(await loadCatalog(ch), a.id);
  if (focused !== ch || player.player.airing?.startsAt !== a.startsAt || !item) return;
  $("pMeta").textContent = [item.year, item.creator].filter(Boolean).join(" · ");
  $("pDesc").textContent = plainText(item.description);
}

function updateProgress() {
  const a = player.player.airing;
  if (!a) return;
  const t = now();
  const done = Math.min(1, Math.max(0, (t - a.startsAt) / (a.endsAt - a.startsAt)));
  $("pBar").style.width = `${done * 100}%`;
  $("pLeft").textContent = `${minutesLeft(a.endsAt - t)} left`;
}

// ---------- expand/collapse (View Transitions) ----------
// The player is never destroyed or recreated here -- only moved between
// `tile` and `watchOverlay` and flipped between compact/full. See
// channels/player-view.js's header for why that's what keeps playback
// gapless across the transition -- which depends on reparent() below
// actually using moveBefore(), not appendChild(). A plain appendChild()
// move IS safe for the <video> element itself (a media element that's
// removed and reinserted within the same microtask/task is explicitly
// exempted from the spec's "pause when removed" steps), but an <iframe>
// -- the YouTube provider's -- has no such exemption: moving it to a new
// parent ANYWHERE in the document, even synchronously, discards its
// browsing context and forces a fresh navigation, which breaks the
// already-established YT.IFrame API handshake and surfaces as this
// component's own "error" state the next time it's driven. moveBefore()
// is the DOM's purpose-built, state-preserving move (it also skips this
// custom element's connectedCallback/disconnectedCallback entirely,
// which is fine -- nothing here depends on either firing for a reparent)
// -- fall back to appendChild() only where moveBefore() isn't supported,
// same graceful-degradation posture as the view transition itself.
function reparent(parent, node) {
  if (typeof parent.moveBefore === "function") {
    try { parent.moveBefore(node, null); return; } catch { /* unsupported for this move -- fall back */ }
  }
  parent.appendChild(node);
}

const tile = $("screen");
const overlay = $("watchOverlay");
let expanded = false;

const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

function animatedMove(move) {
  if (document.startViewTransition && !reduceMotion()) document.startViewTransition(move);
  else move();
}

async function expandChannel(id) {
  // engage() is called synchronously, in this click handler's own call
  // stack, BEFORE any await -- that's what lets this same click both
  // unmute and (for a NEW channel) wait on tune() without losing the
  // browser's user-activation grant for either one. Real OS fullscreen is
  // skipped here -- the view transition below already fills the viewport
  // with CSS, which is the "full screen player" effect; a dblclick or 'f'
  // once expanded still goes properly fullscreen same as watch.html.
  player.engage({ fullscreen: false });
  if (player.channel?.id !== id) await player.tune(id);
  if (expanded) return; // already showing the (now possibly re-tuned) player full-size

  animatedMove(() => {
    reparent(overlay, player);
    player.compact = false;
    overlay.hidden = false;
    document.body.classList.add("player-expanded");
  });
  expanded = true;
}

function collapsePlayer() {
  if (!expanded) return;
  animatedMove(() => {
    reparent(tile, player);
    player.compact = true;
    overlay.hidden = true;
    document.body.classList.remove("player-expanded");
  });
  expanded = false;
}

// The player's own built-in "‹ Channel guide" link (part of its normal
// full-mode chrome) would otherwise just navigate to "./" -- intercepted
// here so it shrinks back into the tile instead, exactly like any other
// cancelable DOM event a reusable component exposes for this.
player.addEventListener("cr-back", (e) => {
  if (!expanded) return; // standalone watch.html has no listener at all -- navigates normally
  e.preventDefault();
  collapsePlayer();
});
addEventListener("keydown", (e) => { if (expanded && e.key === "Escape") collapsePlayer(); });

function everySecond() {
  const t = now();
  $("clock").textContent = clock(t);
  if (t >= nextBoundary || t >= windowStart + span) renderGrid();
  else placeNowLines();
  updateProgress();
}

// Arrow keys move between channels, Enter tunes in.
$("rows").addEventListener("keydown", (e) => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  const chans = [...document.querySelectorAll(".chan")];
  const i = chans.indexOf(document.activeElement);
  const next = chans[Math.min(chans.length - 1, Math.max(0, i + (e.key === "ArrowDown" ? 1 : -1)))];
  if (next) { e.preventDefault(); next.focus(); }
});
$("screen").addEventListener("click", () => focused && expandChannel(focused.id));
$("screen").addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && focused) { e.preventDefault(); expandChannel(focused.id); }
});
$("pWatch").addEventListener("click", () => focused && expandChannel(focused.id));

async function init() {
  document.documentElement.style.setProperty("--lane-w", `${HORIZON * PX_PER_SEC}px`);
  await syncClock();
  $("clock").textContent = clock(now());
  let list;
  try {
    list = await listChannels();
  } catch (err) {
    $("rows").append(el("div", "empty", `Couldn't load the channel list (${err.message}).`));
    return;
  }
  const loaded = await Promise.allSettled(list.map((meta) => loadChannel(meta.id, meta)));
  loaded.forEach((r, i) => { if (r.status === "rejected") console.warn(`Channel ${list[i].id}:`, r.reason); });
  channels = loaded.filter((r) => r.status === "fulfilled").map((r) => r.value);
  if (!channels.length) {
    $("rows").append(el("div", "empty", "No channels are on the air yet."));
    return;
  }

  let saved = null;
  try { saved = localStorage.getItem(FOCUS_KEY); } catch { /* optional */ }
  $("preview").hidden = false;
  setFocus(channels.find((c) => c.id === saved) || channels[0]);
  renderGrid();
  setInterval(everySecond, 1000);
}

init();
</script>
</body>
</html>
