<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Channel Guide</title>
<style>
:root{
  color-scheme:dark;
  --bg:#080b12; --panel:#0f1420; --lane:#121a29; --cell:#1a2338; --cell-hover:#26345a;
  --cell-now:#1d3a6b; --border:#243049; --text:#eef2f8; --muted:#8e9ab0; --accent:#ffcc33; --live:#ff4b4b;
  --chan-w:220px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)}
.brand{font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:14px;color:var(--muted)}
.brand b{color:var(--accent)}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}

.preview{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:24px;padding:20px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#0d1322,var(--bg))}
.screen{position:relative;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;cursor:pointer;box-shadow:0 0 0 1px var(--border)}
.screen video{width:100%;height:100%;object-fit:contain;display:block}
.screen .badge{position:absolute;top:10px;left:10px;background:var(--live);color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;padding:3px 7px;border-radius:4px}
.screen .slate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 50% 40%,#18213a,#05070c);color:var(--muted);text-align:center;padding:16px}
.screen .slate img{max-width:30%;max-height:35%}
.screen .hover-hint{position:absolute;inset:auto 0 0 0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.8));font-weight:700;opacity:0;transition:opacity .15s}
.screen:hover .hover-hint,.screen:focus-visible .hover-hint{opacity:1}
[hidden]{display:none!important}

.info{min-width:0;display:flex;flex-direction:column;gap:8px}
.ch-line{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:700}
.ch-line .num{color:var(--accent);font-size:22px;font-variant-numeric:tabular-nums}
.ch-line img{height:28px}
.info h1{margin:0;font-size:clamp(22px,3vw,32px);line-height:1.15}
.sub{color:var(--muted)}
.progress{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.bar{flex:1;max-width:320px;height:5px;border-radius:3px;background:var(--cell)}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent);width:0}
.desc{margin:0;color:#c3cbd9;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:70ch}
.next{color:var(--muted)}
.next b{color:var(--text)}
.watch{align-self:flex-start;margin-top:6px;background:var(--accent);color:#14100a;font-weight:800;padding:10px 16px;border-radius:6px}
.watch:hover{filter:brightness(1.08)}

.grid{position:relative;padding:0 0 40px}
.ruler,.row{display:grid;grid-template-columns:var(--chan-w) minmax(0,1fr)}
.ruler{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--border);height:38px}
.ruler .day{padding:10px 20px;color:var(--muted);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.ticks{position:relative}
.ticks span{position:absolute;top:10px;padding-left:8px;border-left:1px solid var(--border);height:28px;font-weight:700;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row{height:64px;border-bottom:1px solid var(--border)}
.chan{display:flex;align-items:center;gap:10px;padding:0 14px 0 20px;background:var(--panel);min-width:0}
.chan .num{color:var(--accent);font-weight:800;font-size:18px;min-width:1.6em;font-variant-numeric:tabular-nums}
.chan img{height:30px;max-width:56px;object-fit:contain}
.chan .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.focused .chan{background:#18213a;box-shadow:inset 3px 0 var(--accent)}
.lane{position:relative;background:var(--lane);overflow:hidden}
.prog{position:absolute;top:4px;bottom:4px;padding:7px 10px;background:var(--cell);border-radius:4px;overflow:hidden;white-space:nowrap;min-width:0}
.prog:hover{background:var(--cell-hover)}
.prog.now{background:var(--cell-now)}
.prog.now:hover{background:#28508f}
.prog.cut{border-top-left-radius:0;border-bottom-left-radius:0}
.prog.cut .t::before{content:"‹ ";color:var(--muted)}
.prog .t{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.prog .s{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.gap{position:absolute;top:4px;bottom:4px;background:repeating-linear-gradient(135deg,transparent 0 4px,rgba(255,255,255,.04) 4px 8px)}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--live);z-index:1;pointer-events:none}
.empty{padding:40px 20px;color:var(--muted)}

@media (max-width:900px){
  .preview{grid-template-columns:1fr;gap:14px;padding:16px}
  :root{--chan-w:150px}
}
@media (max-width:600px){
  :root{--chan-w:84px}
  .top{padding:12px 16px}
  .chan{padding:0 8px 0 16px}
  .chan .name{display:none}
  .chan img{max-width:44px}
  .ruler .day{padding:10px 16px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>CRVideo</b> Channel Guide</div>
  <div class="clock" id="clock"></div>
</header>

<section class="preview" id="preview" hidden>
  <button class="screen" id="screen" aria-label="Watch this channel">
    <video id="previewVideo" muted playsinline autoplay></video>
    <div class="slate" id="previewSlate" hidden><img id="slateLogo" alt=""><div id="slateText"></div></div>
    <span class="badge">LIVE</span>
    <span class="hover-hint">Watch full screen ›</span>
  </button>
  <div class="info">
    <div class="ch-line"><span class="num" id="pNum"></span><img id="pLogo" alt=""><span id="pName"></span></div>
    <h1 id="pTitle"></h1>
    <div class="sub" id="pMeta"></div>
    <div class="progress"><span id="pRange"></span><div class="bar"><i id="pBar"></i></div><span id="pLeft"></span></div>
    <p class="desc" id="pDesc"></p>
    <div class="next" id="pNext"></div>
    <button class="watch" id="pWatch">Watch</button>
  </div>
</section>

<section class="grid" id="grid" aria-label="Program guide">
  <div class="ruler"><div class="day" id="day">Today</div><div class="ticks" id="ticks"></div></div>
  <div id="rows"></div>
</section>

<script type="module">
import {
  listChannels, loadChannel, loadCatalog, locate, airings, nextProgram, now, syncClock,
  clock, minutesLeft, plainText, BroadcastPlayer,
} from "./broadcast.js";

const SLOT = 1800;
const FOCUS_KEY = "crvideo:guide-focus";
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

let channels = [];
let focused = null;
let windowStart = 0;
let span = 0;
let nextBoundary = Infinity;
const openWindows = new Map();

const preview = new BroadcastPlayer($("previewVideo"), {
  onAiring: () => renderPreview(),
  onState: (state, airing) => {
    const slate = state === "slate" || state === "error" || !airing?.playable;
    $("previewSlate").hidden = !slate;
    $("slateText").textContent = state === "error" ? "Signal lost, reconnecting…" : "Station break";
  },
});

/** Opens the channel in its own window. The video starts muted and live on
 *  load; one click there turns on sound and full screen. */
function openChannel(id) {
  const existing = openWindows.get(id);
  if (existing && !existing.closed) { existing.focus(); return; }
  const url = new URL(`watch.html?ch=${encodeURIComponent(id)}`, location.href).href;
  const w = window.open(url, `crvideo-${id}`,
    `popup,left=0,top=0,width=${screen.availWidth},height=${screen.availHeight}`);
  if (w) openWindows.set(id, w);
  else location.href = url;
}

function spanFor(width) {
  return width < 600 ? 3600 : width < 1100 ? 5400 : 7200;
}

/** Start of the current local half hour. */
function halfHourStart(t) {
  const tz = new Date(t * 1000).getTimezoneOffset() * 60;
  return Math.floor((t - tz) / SLOT) * SLOT + tz;
}

const pct = (t) => `${((t - windowStart) / span) * 100}%`;

function renderGrid() {
  const t = now();
  windowStart = halfHourStart(t);
  span = spanFor(innerWidth);
  const until = windowStart + span;

  const ticks = $("ticks");
  ticks.replaceChildren();
  for (let s = windowStart; s < until; s += SLOT) {
    const tick = el("span", null, clock(s));
    tick.style.left = pct(s);
    ticks.append(tick);
  }

  const hadFocus = document.activeElement?.closest?.(".row")?.dataset.id;
  const rows = $("rows");
  rows.replaceChildren();
  nextBoundary = windowStart + SLOT;

  for (const ch of channels) {
    const row = el("div", "row");
    row.dataset.id = ch.id;
    row.classList.toggle("focused", ch.id === focused?.id);

    const chan = el("button", "chan");
    chan.setAttribute("aria-label", `Channel ${ch.number ?? ""} ${ch.name}`.replace(/\s+/g, " "));
    if (ch.number != null) chan.append(el("span", "num", String(ch.number)));
    if (ch.logo) { const img = el("img"); img.src = ch.logo; img.alt = ""; chan.append(img); }
    chan.append(el("span", "name", ch.name));
    chan.addEventListener("click", () => openChannel(ch.id));
    row.append(chan);

    const lane = el("div", "lane");
    for (const a of airings(ch.timeline, windowStart, until)) {
      const left = Math.max(a.startsAt, windowStart);
      const right = Math.min(a.endsAt, until);
      if (a.startsAt <= t && t < a.endsAt) nextBoundary = Math.min(nextBoundary, a.endsAt);
      if (!a.playable) {
        const gap = el("div", "gap");
        gap.style.left = pct(left);
        gap.style.width = `${((right - left) / span) * 100}%`;
        lane.append(gap);
        continue;
      }
      const cell = el("button", "prog");
      cell.style.left = `calc(${pct(left)} + 2px)`;
      cell.style.width = `calc(${((right - left) / span) * 100}% - 4px)`;
      cell.classList.toggle("now", a.startsAt <= t && t < a.endsAt);
      cell.classList.toggle("cut", a.startsAt < windowStart);
      cell.title = `${a.title}\n${clock(a.startsAt)} – ${clock(a.endsAt)}`;
      cell.tabIndex = -1;
      cell.append(el("span", "t", a.title), el("span", "s", `${clock(a.startsAt)} – ${clock(a.endsAt)}`));
      cell.addEventListener("click", () => openChannel(ch.id));
      lane.append(cell);
    }
    lane.append(el("div", "nowline"));
    row.append(lane);

    row.addEventListener("mouseenter", () => hoverFocus(ch));
    row.addEventListener("focusin", () => setFocus(ch));
    rows.append(row);
  }

  if (hadFocus) rows.querySelector(`.row[data-id="${CSS.escape(hadFocus)}"] .chan`)?.focus();
  placeNowLines();
}

function placeNowLines() {
  const left = pct(now());
  for (const line of document.querySelectorAll(".nowline")) line.style.left = left;
}

let hoverTimer = 0;
function hoverFocus(ch) {
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(() => setFocus(ch), 180);
}

function setFocus(ch) {
  clearTimeout(hoverTimer);
  if (focused?.id === ch.id) return;
  focused = ch;
  try { localStorage.setItem(FOCUS_KEY, ch.id); } catch { /* optional */ }
  for (const row of document.querySelectorAll(".row")) row.classList.toggle("focused", row.dataset.id === ch.id);
  $("pNum").textContent = ch.number ?? "";
  $("pName").textContent = ch.name;
  $("pLogo").hidden = !ch.logo;
  if (ch.logo) $("pLogo").src = ch.logo;
  $("slateLogo").hidden = !ch.logo;
  if (ch.logo) $("slateLogo").src = ch.logo;
  $("pWatch").textContent = ch.number != null ? `Watch channel ${ch.number}` : `Watch ${ch.name}`;
  preview.setTimeline(ch.timeline);
}

async function renderPreview() {
  const ch = focused;
  if (!ch) return;
  const a = preview.airing || locate(ch.timeline);
  const t = now();
  $("pTitle").textContent = a.playable ? a.title : "Station break";
  $("pRange").textContent = `${clock(a.startsAt)} – ${clock(a.endsAt)}`;
  const next = nextProgram(ch.timeline, t);
  $("pNext").replaceChildren();
  if (next) $("pNext").append("Next: ", el("b", null, next.title), ` at ${clock(next.startsAt)}`);
  updateProgress();

  $("pMeta").textContent = "";
  $("pDesc").textContent = a.playable ? "" : ch.description;
  if (!a.playable) return;
  const item = (await loadCatalog(ch)).get(a.id);
  if (focused !== ch || preview.airing?.startsAt !== a.startsAt || !item) return;
  $("pMeta").textContent = [item.year, item.creator].filter(Boolean).join(" · ");
  $("pDesc").textContent = plainText(item.description);
}

function updateProgress() {
  const a = preview.airing;
  if (!a) return;
  const t = now();
  const done = Math.min(1, Math.max(0, (t - a.startsAt) / (a.endsAt - a.startsAt)));
  $("pBar").style.width = `${done * 100}%`;
  $("pLeft").textContent = `${minutesLeft(a.endsAt - t)} left`;
}

function everySecond() {
  const t = now();
  $("clock").textContent = clock(t);
  if (t >= windowStart + SLOT || t >= nextBoundary) renderGrid();
  else placeNowLines();
  updateProgress();
}

// Arrow keys move between channels, Enter tunes in.
$("rows").addEventListener("keydown", (e) => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  const chans = [...document.querySelectorAll(".chan")];
  const i = chans.indexOf(document.activeElement);
  const next = chans[Math.min(chans.length - 1, Math.max(0, i + (e.key === "ArrowDown" ? 1 : -1)))];
  if (next) { e.preventDefault(); next.focus(); }
});
$("screen").addEventListener("click", () => focused && openChannel(focused.id));
$("pWatch").addEventListener("click", () => focused && openChannel(focused.id));
let lastSpan = 0;
addEventListener("resize", () => {
  if (spanFor(innerWidth) !== lastSpan) { lastSpan = spanFor(innerWidth); renderGrid(); }
});

async function init() {
  await syncClock();
  $("clock").textContent = clock(now());
  let list;
  try {
    list = await listChannels();
  } catch (err) {
    $("rows").append(el("div", "empty", `Couldn't load the channel list (${err.message}).`));
    return;
  }
  const loaded = await Promise.allSettled(list.map((meta) => loadChannel(meta.id, meta)));
  loaded.forEach((r, i) => { if (r.status === "rejected") console.warn(`Channel ${list[i].id}:`, r.reason); });
  channels = loaded.filter((r) => r.status === "fulfilled").map((r) => r.value);
  if (!channels.length) {
    $("rows").append(el("div", "empty", "No channels are on the air yet."));
    return;
  }

  let saved = null;
  try { saved = localStorage.getItem(FOCUS_KEY); } catch { /* optional */ }
  lastSpan = spanFor(innerWidth);
  $("preview").hidden = false;
  setFocus(channels.find((c) => c.id === saved) || channels[0]);
  renderGrid();
  preview.start();
  setInterval(everySecond, 1000);
}

init();
</script>
</body>
</html>
