<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- LARC/PAN message bus (vendor/larc/pan.js, see docs/bus-topics.md). Must precede every module script. -->
<script type="importmap">{ "imports": { "@larcjs/core": "../vendor/larc/pan.js" } }</script>
<title>Watch</title>
<style>
html,body{margin:0;height:100%;background:#000}
cr-channel-player{display:block;width:100%;height:100%}
</style>
</head>
<body>
<pan-bus hidden></pan-bus>
<cr-channel-player id="player"></cr-channel-player>

<script type="module">
// Standalone full-page player -- deep links (?ch=<id>), kiosk/TV browsers,
// OBS browser sources, or just "open this channel in its own window" from
// the guide. All of the actual playback/remote-control/continuity-card
// logic lives in <cr-channel-player> (channels/player-view.js), the exact
// same element channels/index.html expands in place -- this page is only
// ever a thin bootstrap around it, never a second implementation.
import { CHANNEL_ID } from "./player-view.js";
import { syncClock } from "./broadcast.js";

const player = document.getElementById("player");
const id = new URLSearchParams(location.search).get("ch");

if (!CHANNEL_ID.test(id || "")) {
  document.body.insertAdjacentHTML("beforeend",
    '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#a3adbf;font:16px system-ui">No channel selected.</div>');
} else {
  await Promise.race([syncClock(), new Promise((r) => setTimeout(r, 1500))]);
  await player.tune(id);
}
</script>
</body>
</html>
