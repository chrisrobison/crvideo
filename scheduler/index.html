<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- LARC/PAN message bus (vendor/larc/pan.js, see docs/bus-topics.md). Must precede every module script. -->
<script type="importmap">{ "imports": { "@larcjs/core": "../vendor/larc/pan.js" } }</script>
<title>ChannelFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%233b82f6'/%3E%3Cpath d='M9 7l8 5-8 5V7z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/tokens.css">
<style>
  .app{ display:flex; flex-direction:column; min-height:100vh; }
  /* Preserves the original flex-fill behavior (main.layout{flex:1} needs
     a flex-container parent to mean anything) now that the schedule view
     lives one level deeper, inside a [data-view] wrapper. */
  div[data-view="legacy-schedule"]{ display:flex; flex-direction:column; flex:1; min-width:0; }
  .stat-strip{ padding:16px 20px 0; }
  main.layout{
    display:grid;
    grid-template-columns: 300px minmax(0,1fr) 340px;
    gap:16px;
    padding:16px 20px 24px;
    align-items:start;
    flex:1;
  }
  .media-col{ height:calc(100vh - 210px); min-height:420px; position:sticky; top:16px; }
  .center-col{ display:flex; flex-direction:column; gap:16px; min-width:0; }
  .details-col{ min-width:0; }
  @media (max-width:1200px){
    main.layout{ grid-template-columns: 1fr; }
    .media-col{ height:420px; position:static; }
  }
  /* [data-view] sections toggle visibility via the plain `hidden`
     attribute (see js/view.js / js/main.js's applyView()) -- this
     !important override is needed because some of these sections (e.g.
     main.layout's own `display:grid` rule above) would otherwise beat
     the browser's default [hidden]{display:none} UA rule, which has
     lower cascade priority than ANY author rule, not lower specificity. */
  [data-view][hidden]{ display:none !important; }
  /* Guide: the real viewer-facing channel guide in a frame, full-bleed. */
  .app:has(> .guide-view:not([hidden])){ height:100vh; min-height:0; }
  .guide-view{ flex:1; min-height:0; display:flex; }
  .guide-view iframe{ flex:1; width:100%; height:100%; border:0; background:#080b12; }
  .admin-view{ padding:16px 20px 24px; max-width:1400px; margin:0 auto; }
  /* Bump Studio is a full-bleed, viewport-height workspace: its panels
     scroll independently instead of the page. */
  .app:has(> .studio-view:not([hidden])){ height:100vh; min-height:0; }
  .studio-view{ flex:1; min-height:0; }
  /* Explorer is likewise a full-bleed workspace whose columns scroll independently. */
  .app:has(> .explorer-view:not([hidden])){ height:100vh; min-height:0; }
  .explorer-view{ flex:1; min-height:0; }
  /* The revamped Series / Programming / Schedule screens are viewport-height
     workspaces too: header on top, panels below scroll independently. */
  .app:has(> .workspace-view:not([hidden])){ height:100vh; min-height:0; }
  .workspace-view{ flex:1; min-height:0; display:flex; flex-direction:column; }
  @media (max-width:1100px){
    .app:has(> .workspace-view:not([hidden])){ height:auto; min-height:100vh; }
  }
</style>
</head>
<body>
<pan-bus hidden></pan-bus>
<div class="app">
  <cf-header></cf-header>
  <div data-view="legacy-schedule" hidden>
    <div class="stat-strip"><cf-stat-bar></cf-stat-bar></div>
    <main class="layout">
      <aside class="media-col"><cf-media-library></cf-media-library></aside>
      <section class="center-col">
        <cf-timeline></cf-timeline>
        <cf-rundown></cf-rundown>
      </section>
      <aside class="details-col">
        <cf-details-panel></cf-details-panel>
        <cf-program-monitor></cf-program-monitor>
      </aside>
    </main>
  </div>
  <div data-view="schedule" class="workspace-view" hidden>
    <cf-broadcast-schedule></cf-broadcast-schedule>
  </div>
  <div data-view="guide" class="guide-view" hidden>
    <iframe id="guideFrame" title="Channel Guide (viewer's view)" data-src="../channels/index.html"
            allow="autoplay; fullscreen" src="about:blank"></iframe>
  </div>
  <div data-view="series" class="workspace-view" hidden>
    <cf-series-admin></cf-series-admin>
  </div>
  <div data-view="programming" class="workspace-view" hidden>
    <cf-channel-admin></cf-channel-admin>
  </div>
  <div data-view="bumps" class="studio-view" hidden>
    <cf-bump-studio></cf-bump-studio>
  </div>
  <div data-view="explorer" class="explorer-view" hidden>
    <cf-explorer></cf-explorer>
  </div>
</div>
<cf-drive-folder-picker></cf-drive-folder-picker>
<script type="module" src="js/main.js"></script>
</body>
</html>
