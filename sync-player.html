<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clock-Synced Stream Player</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#stage,#html5Player,#vimeoPlayer{position:absolute;inset:0;width:100%;height:100%;background:#000}
#html5Player{object-fit:contain}.hidden{display:none!important}
#vimeoPlayer iframe{width:100%;height:100%;border:0}
#status{position:absolute;left:16px;top:16px;z-index:20;max-width:min(620px,calc(100vw - 32px));padding:10px 12px;border-radius:8px;background:rgba(0,0,0,.72);color:#fff;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;white-space:pre-wrap;pointer-events:none}
#startButton{position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);appearance:none;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:14px 20px;background:rgba(0,0,0,.82);color:#fff;font:600 16px/1 system-ui,sans-serif;cursor:pointer}
#soundButton{position:absolute;z-index:25;right:16px;bottom:16px;appearance:none;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:8px 12px;background:rgba(0,0,0,.6);color:#fff;font:13px/1 system-ui,sans-serif;cursor:pointer;opacity:.75}
#soundButton:hover{opacity:1}
</style>
</head>
<body>
<div id="stage">
  <video id="html5Player" class="hidden" playsinline preload="auto"></video>
  <div id="vimeoPlayer" class="hidden"></div>
</div>
<div id="status" class="hidden"></div>
<button id="startButton" class="hidden" type="button">Start playback</button>
<button id="soundButton" type="button">🔈 Tap for sound</button>
<script type="module">
"use strict";

// ---------------------------------------------------------------------------
// Player
//
// No Google Drive OAuth here at all, by design: every driveFileId entry is
// expected to already be sitting in cache/manifest.json (see
// server/download-cache.php, which pre-fetches + remuxes current/next on a
// cron). If an entry isn't cached yet, resolveUrl() throws and the normal
// backoff/retry loop below just waits for the downloader to catch up --
// no fallback to live-streaming straight from Drive in the browser. That
// direct-from-browser path is exactly what caused the Google anti-abuse
// block, the ORB stripping, and the autoplay/fragmented-MP4 issues earlier;
// removing it entirely removes that whole class of failure, at the cost of
// no safety net if the cache downloader itself ever falls behind or breaks
// (cron down, Drive API outage, disk full) -- that shows as a retrying
// error on screen instead of degraded-but-working playback.
// ---------------------------------------------------------------------------
(() => {
  const qs = new URLSearchParams(location.search);
  const PLAYLIST_URL = qs.get("playlist") || "playlist.json";
  const CACHE_MANIFEST_URL = qs.get("cacheManifest") || "cache/manifest.json";
  const DEBUG = qs.has("debug");
  // For a kiosk launcher running Chrome with
  // --autoplay-policy=no-user-gesture-required: skip the mute-then-click
  // dance entirely and default straight to unmuted playback. Without a
  // matching browser flag this will just fail the same way unmuted autoplay
  // normally does, falling back to the Start-playback gate.
  const FORCE_UNMUTED = qs.has("unmuted");
  const MANIFEST_REFRESH_MS = 60000;
  const SYNC_INTERVAL_MS = 1000;
  const DRIFT_CHECK_MS = 5000;
  const DRIFT_TOLERANCE_SECONDS = 1.5;
  // Playback-failure backoff -- without this, a URL that 403s (e.g. a Google
  // anti-abuse block) gets re-requested once per SYNC_INTERVAL_MS forever,
  // which looks exactly like the automated-traffic pattern that trips that
  // block in the first place. Back off per failing entry instead.
  const RETRY_BASE_MS = 3000;
  const RETRY_MAX_MS = 60000;

  const html5 = document.getElementById("html5Player");
  const vimeoHost = document.getElementById("vimeoPlayer");
  const status = document.getElementById("status");
  const startButton = document.getElementById("startButton");
  const soundButton = document.getElementById("soundButton");

  // Unattended kiosk/signage displays have no one to click a "Start
  // playback" button, and Chrome only allows autoplay without a user
  // gesture when the video is muted. So every entry starts muted by
  // default (autoplay just works, no click required) and this small
  // corner button is an optional, non-blocking way to turn sound on if
  // someone IS there to tap it -- it never gates playback the way
  // startButton's Drive-sign-in gate does.
  const SOUND_STORAGE_KEY = "channelflow:player-sound-enabled";
  let soundEnabled = FORCE_UNMUTED;
  if (!soundEnabled) {
    try { soundEnabled = sessionStorage.getItem(SOUND_STORAGE_KEY) === "1"; } catch (_) {}
  }
  if (soundEnabled) soundButton.classList.add("hidden");

  let entries = [];
  let recurring = false;
  let timezone = null;
  // Populated from cache/manifest.json -- see server/download-cache.php.
  // Maps driveFileId -> { ready, path, ... }. An entry not in here (or not
  // yet ready:true) simply can't play until the downloader catches up --
  // see the no-Drive-OAuth note above.
  let cacheManifest = {};
  let current = null;
  let provider = null;
  let vimeo = null;
  let vimeoApiPromise = null;
  let lastDriftCheck = 0;
  let switching = false;
  let lastFailedEntryId = null;
  let lastFailureAt = 0;
  let failureCount = 0;

  if (DEBUG) status.classList.remove("hidden");

  const parseTime = value => {
    const ms = Date.parse(value);
    if (!Number.isFinite(ms)) throw new Error(`Invalid timestamp: ${value}`);
    return ms;
  };

  // -- Daily-recurring time-of-day math -------------------------------------
  // Entries in "recurring" manifests give startSec/endSec as seconds-since-
  // midnight in `timezone` (an IANA zone name), repeating every day. We find
  // "now" expressed the same way (seconds since local midnight in that zone)
  // so the same program airs at the same real-world time every day regardless
  // of the viewer's own timezone, and regardless of DST shifts.
  const zoneFormatterCache = new Map();
  function zoneFormatter(tz) {
    if (!zoneFormatterCache.has(tz)) {
      zoneFormatterCache.set(tz, new Intl.DateTimeFormat("en-US", {
        timeZone: tz, hour12: false,
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit",
      }));
    }
    return zoneFormatterCache.get(tz);
  }

  function secondsSinceMidnight(date, tz) {
    const parts = zoneFormatter(tz).formatToParts(date);
    const get = type => Number(parts.find(p => p.type === type)?.value ?? 0);
    const hour = get("hour") % 24; // "24" shows up at local midnight in some locales/Intl impls
    return hour * 3600 + get("minute") * 60 + get("second") + (date.getMilliseconds() / 1000);
  }

  function findActiveRecurringEntry(nowSec) {
    return entries.find(item => nowSec >= item.startSec && nowSec < item.endSec) || null;
  }

  function normalizeManifest(data) {
    if (data && data.recurring === true) {
      recurring = true;
      timezone = data.timezone || "UTC";
      const list = Array.isArray(data.entries) ? data.entries : [];
      const normalized = list.map((item, index) => ({ ...item, id: item.id || `entry-${index}` }))
        .sort((a, b) => a.startSec - b.startSec);
      normalized.forEach(item => {
        if (!Number.isFinite(item.startSec) || !Number.isFinite(item.endSec)) {
          throw new Error(`Missing/invalid startSec or endSec for ${item.id}`);
        }
        if (item.endSec <= item.startSec) throw new Error(`End must be after start for ${item.id}`);
        if (!item.url && !item.driveFileId) throw new Error(`Missing url/driveFileId for ${item.id}`);
      });
      return normalized;
    }

    // Legacy absolute-date manifest (one-off schedule for a specific calendar day).
    recurring = false;
    timezone = null;
    const list = Array.isArray(data) ? data : data.entries;
    if (!Array.isArray(list)) throw new Error("playlist.json must contain an array or { entries: [...] }");

    const normalized = list.map((item, index) => ({
      ...item,
      id: item.id || `entry-${index}`,
      startMs: parseTime(item.start),
    })).sort((a, b) => a.startMs - b.startMs);

    normalized.forEach((item, index) => {
      if (item.end) item.endMs = parseTime(item.end);
      else if (Number.isFinite(Number(item.durationSeconds))) item.endMs = item.startMs + Number(item.durationSeconds) * 1000;
      else if (normalized[index + 1]) item.endMs = normalized[index + 1].startMs;
      else item.endMs = Infinity;

      if (!item.url && !item.driveFileId) throw new Error(`Missing url/driveFileId for ${item.id}`);
      if (item.endMs <= item.startMs) throw new Error(`End time must be after start time for ${item.id}`);
    });
    return normalized;
  }

  async function loadManifest() {
    const sep = PLAYLIST_URL.includes("?") ? "&" : "?";
    const r = await fetch(`${PLAYLIST_URL}${sep}_=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(`Playlist request failed: ${r.status}`);
    entries = normalizeManifest(await r.json());
  }

  /** Best-effort -- if this 404s or is unreachable, every entry just falls
   *  back to the live Drive stream, so failures here are never fatal. */
  async function loadCacheManifest() {
    try {
      const sep = CACHE_MANIFEST_URL.includes("?") ? "&" : "?";
      const r = await fetch(`${CACHE_MANIFEST_URL}${sep}_=${Date.now()}`, { cache: "no-store" });
      cacheManifest = r.ok ? await r.json() : {};
    } catch (_) {
      cacheManifest = {};
    }
  }

  function findActiveEntry(nowMs) {
    if (recurring) return findActiveRecurringEntry(secondsSinceMidnight(new Date(nowMs), timezone));
    return entries.find(item => nowMs >= item.startMs && nowMs < item.endMs) || null;
  }

  function desiredOffsetSeconds(item, nowMs = Date.now()) {
    if (recurring) {
      const sod = secondsSinceMidnight(new Date(nowMs), timezone);
      return Math.max(0, sod - item.startSec);
    }
    return Math.max(0, (nowMs - item.startMs) / 1000);
  }

  /** Resolve an entry's playable URL -- a literal `url`, or a locally-cached
   *  copy (see server/download-cache.php). A driveFileId entry that isn't
   *  cached yet throws, which feeds the normal backoff/retry loop in sync()
   *  below rather than falling back to streaming live from Drive. */
  async function resolveUrl(item) {
    if (item.driveFileId) {
      const cached = cacheManifest[item.driveFileId];
      if (cached && cached.ready) return cached.path;
      throw new Error(`Not cached yet (driveFileId: ${item.driveFileId})`);
    }
    return item.url;
  }

  const detectProvider = item => item.provider ? item.provider.toLowerCase() : (/(^|\/\/)(www\.)?vimeo\.com\//i.test(item.url || "") ? "vimeo" : "html5");
  const vimeoIdFromUrl = url => String(url).match(/vimeo\.com\/(?:video\/)?(\d+)/i)?.[1] || null;
  const showStartButton = () => startButton.classList.remove("hidden");
  const hideStartButton = () => startButton.classList.add("hidden");

  /** Exponential backoff with jitter, capped at RETRY_MAX_MS. */
  function backoffDelay(attempt) {
    const capped = Math.min(RETRY_MAX_MS, RETRY_BASE_MS * Math.pow(2, attempt - 1));
    return capped * (0.75 + Math.random() * 0.5);
  }

  /** Always-visible (not just ?debug) failure indicator -- previously a
   *  blocked/403'd stream failed completely silently from the viewer's side. */
  function showError(message) {
    status.classList.remove("hidden");
    status.textContent = message;
  }

  async function ensureVimeoApi() {
    if (window.Vimeo?.Player) return;
    if (vimeoApiPromise) return vimeoApiPromise;
    vimeoApiPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://player.vimeo.com/api/player.js";
      s.onload = resolve;
      s.onerror = () => reject(new Error("Unable to load Vimeo Player API"));
      document.head.appendChild(s);
    });
    return vimeoApiPromise;
  }

  async function stopCurrentPlayer() {
    if (provider === "html5") {
      html5.pause();
      html5.removeAttribute("src");
      html5.load();
      html5.classList.add("hidden");
    }
    if (provider === "vimeo" && vimeo) {
      try { await vimeo.destroy(); } catch (_) {}
      vimeo = null;
      vimeoHost.innerHTML = "";
      vimeoHost.classList.add("hidden");
    }
    provider = null;
  }

  async function startHtml5(item, offset) {
    const url = await resolveUrl(item);
    provider = "html5";
    html5.classList.remove("hidden");
    vimeoHost.classList.add("hidden");
    html5.src = url;
    html5.muted = item.muted === true ? true : !soundEnabled;

    await new Promise((resolve, reject) => {
      const cleanup = () => {
        html5.removeEventListener("loadedmetadata", onLoaded);
        html5.removeEventListener("error", onError);
      };
      const onLoaded = () => { cleanup(); resolve(); };
      const onError = () => { cleanup(); reject(new Error(`Unable to load video: ${item.id}`)); };
      html5.addEventListener("loadedmetadata", onLoaded, { once: true });
      html5.addEventListener("error", onError, { once: true });
      html5.load();
    });

    const maxTime = Number.isFinite(html5.duration) ? Math.max(0, html5.duration - .25) : offset;
    html5.currentTime = Math.min(offset, maxTime);
    try { await html5.play(); hideStartButton(); } catch (_) { showStartButton(); }
  }

  async function startVimeo(item, offset) {
    await ensureVimeoApi();
    const id = item.vimeoId || vimeoIdFromUrl(item.url);
    if (!id) throw new Error(`Could not determine Vimeo video ID from ${item.url}`);

    provider = "vimeo";
    html5.classList.add("hidden");
    vimeoHost.classList.remove("hidden");
    vimeoHost.innerHTML = "";
    vimeo = new Vimeo.Player(vimeoHost, {
      id: Number(id),
      autoplay: true,
      controls: false,
      muted: item.muted === true ? true : !soundEnabled,
      responsive: true
    });
    await vimeo.ready();
    await vimeo.setCurrentTime(offset);
    try { await vimeo.play(); hideStartButton(); } catch (_) { showStartButton(); }
  }

  async function switchTo(item, offset) {
    if (switching) return;
    switching = true;
    try {
      await stopCurrentPlayer();
      if (detectProvider(item) === "vimeo") await startVimeo(item, offset);
      else await startHtml5(item, offset);
      current = item;
      lastDriftCheck = Date.now();
      lastFailedEntryId = null;
      failureCount = 0;
      if (!DEBUG) status.classList.add("hidden");
    } finally { switching = false; }
  }

  async function getCurrentPlaybackTime() {
    if (provider === "html5") return Number.isFinite(html5.currentTime) ? html5.currentTime : 0;
    if (provider === "vimeo" && vimeo) return await vimeo.getCurrentTime();
    return 0;
  }

  async function seekCurrent(seconds) {
    if (provider === "html5" && html5.readyState >= 1) html5.currentTime = seconds;
    else if (provider === "vimeo" && vimeo) await vimeo.setCurrentTime(seconds);
  }

  async function playCurrent() {
    try {
      if (provider === "html5") await html5.play();
      else if (provider === "vimeo" && vimeo) await vimeo.play();
      hideStartButton();
    } catch (_) { showStartButton(); }
  }

  function updateStatus(item, desired, drift) {
    if (!DEBUG) return;
    const now = new Date();
    const clockLine = recurring
      ? `Clock:   ${now.toISOString()} (${timezone} tod=${secondsSinceMidnight(now, timezone).toFixed(1)}s)`
      : `Clock:   ${now.toISOString()}`;
    const cached = item?.driveFileId ? cacheManifest[item.driveFileId] : null;
    status.textContent = !item
      ? `No scheduled video\n${clockLine}\nEntries: ${entries.length}`
      : `${item.title || item.id}\n${clockLine}\nOffset:  ${desired.toFixed(2)}s\nDrift:   ${drift >= 0 ? "+" : ""}${drift.toFixed(2)}s\nSource:  ${provider}\nCached:  ${item.driveFileId ? (cached?.ready ? "yes" : "no") : "n/a"}`;
  }

  async function sync(force = false) {
    if (!entries.length || switching) return;
    const now = Date.now();
    const active = findActiveEntry(now);

    if (!active) {
      if (current) { await stopCurrentPlayer(); current = null; }
      updateStatus(null, 0, 0);
      return;
    }

    const desired = desiredOffsetSeconds(active, now);
    if (!current || current.id !== active.id) {
      // Throttle retries for an entry that's already failing -- without this,
      // a bad/blocked URL gets re-requested every SYNC_INTERVAL_MS forever.
      if (lastFailedEntryId === active.id && now - lastFailureAt < backoffDelay(failureCount)) {
        return;
      }
      try {
        await switchTo(active, desired);
        updateStatus(active, desired, 0);
      } catch (e) {
        if (lastFailedEntryId !== active.id) failureCount = 0;
        lastFailedEntryId = active.id;
        failureCount++;
        lastFailureAt = Date.now();
        const delay = backoffDelay(failureCount);
        showError(`Playback error (attempt ${failureCount}): ${e.message}\nRetrying in ~${Math.round(delay / 1000)}s`);
        console.error(e);
      }
      return;
    }

    if (force || now - lastDriftCheck >= DRIFT_CHECK_MS) {
      lastDriftCheck = now;
      const actual = await getCurrentPlaybackTime();
      const drift = actual - desired;
      if (Math.abs(drift) > DRIFT_TOLERANCE_SECONDS) await seekCurrent(desired);
      updateStatus(active, desired, drift);
    }
  }

  // Generic autoplay-blocked fallback (startHtml5/startVimeo's play().catch
  // shows this button if even muted autoplay gets rejected by the browser
  // for some other reason) -- just needs a user gesture to retry play().
  startButton.addEventListener("click", async () => {
    await playCurrent();
    await sync(true);
  });

  soundButton.addEventListener("click", async () => {
    soundEnabled = true;
    try { sessionStorage.setItem(SOUND_STORAGE_KEY, "1"); } catch (_) {}
    soundButton.classList.add("hidden");
    if (provider === "html5") html5.muted = false;
    else if (provider === "vimeo" && vimeo) { try { await vimeo.setMuted(false); } catch (_) {} }
  });
  html5.addEventListener("ended", () => sync(true));
  html5.addEventListener("error", () => {
    // Force a reload of the active entry through the normal switch path --
    // sync()'s backoff logic (below) decides *when* that's actually allowed
    // to hit the network again, instead of retrying unconditionally.
    if (DEBUG) console.error("html5 playback error", html5.error);
    current = null;
    sync(true).catch(console.error);
  });

  (async function boot() {
    try {
      await loadManifest();
      await loadCacheManifest();
      await sync(true);
      setInterval(() => sync().catch(console.error), SYNC_INTERVAL_MS);
      setInterval(async () => {
        try { await loadManifest(); await loadCacheManifest(); await sync(true); }
        catch (e) { console.error(e); }
      }, MANIFEST_REFRESH_MS);
    } catch (e) {
      console.error(e);
      status.classList.remove("hidden");
      status.textContent = `Player startup failed:\n${e.message}`;
    }
  })();
})();
</script>
</body>
</html>
